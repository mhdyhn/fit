name: Build Rokh Fit APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Rebuild Android project structure
        shell: bash
        run: |
          mkdir -p app/src/main/java/app/rokh/fitness
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp MainActivity.java app/src/main/java/app/rokh/fitness/MainActivity.java
          cp index.html app/src/main/assets/index.html
          cp styles.xml app/src/main/res/values/styles.xml

          cp "build (5).gradle" app/build.gradle

          cp ic_launcher.png app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp ic_launcher.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          echo "Android project structure created."
          find app -maxdepth 8 -type f

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RokhFit-v1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RokhFit-APK
          path: RokhFit-v1.0.apk
          if-no-files-found: error
          retention-days: 30
