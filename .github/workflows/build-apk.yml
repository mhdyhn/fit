name: Build Rokh Fit APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Show Android SDK information
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          which sdkmanager || true
          sdkmanager --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Install required Android SDK packages
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Android project structure
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/app/rokh/fitness
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          cp AndroidManifest.xml \
            app/src/main/AndroidManifest.xml

          cp MainActivity.java \
            app/src/main/java/app/rokh/fitness/MainActivity.java

          cp index.html \
            app/src/main/assets/index.html

          cp styles.xml \
            app/src/main/res/values/styles.xml

          cp ic_launcher.png \
            app/src/main/res/mipmap-mdpi/ic_launcher.png

          cp ic_launcher.png \
            app/src/main/res/mipmap-hdpi/ic_launcher.png

          cp ic_launcher.png \
            app/src/main/res/mipmap-xhdpi/ic_launcher.png

          cp ic_launcher.png \
            app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          cp ic_launcher.png \
            app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Fix Gradle build files
        shell: bash
        run: |
          set -e

          cp build.gradle /tmp/app-build.gradle
          cp "build (5).gradle" build.gradle
          cp /tmp/app-build.gradle app/build.gradle

          echo "Root build.gradle:"
          cat build.gradle

          echo ""
          echo "App build.gradle:"
          cat app/build.gradle

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          test -f settings.gradle
          test -f gradle.properties
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          test -f app/src/main/java/app/rokh/fitness/MainActivity.java
          test -f app/src/main/res/values/styles.xml
          test -f app/src/main/res/mipmap-mdpi/ic_launcher.png

          echo "Android project structure is valid."

          find app/src/main -type f | sort

      - name: Build debug APK
        shell: bash
        run: |
          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Verify generated APK
        shell: bash
        run: |
          set -e

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "APK was not generated."
            exit 1
          fi

          ls -lh "$APK_PATH"

      - name: Rename APK
        shell: bash
        run: |
          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            RokhFit-v1.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RokhFit-APK
          path: RokhFit-v1.0.apk
          if-no-files-found: error
          retention-days: 30
